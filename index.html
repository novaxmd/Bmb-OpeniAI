<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send WhatsApp Message</title>

  <style>
    /* Reset */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1f1f1f, #2c2c2c);
      color: #fff;
    }

    .container {
      background: #2e2e2e;
      padding: 30px 25px;
      border-radius: 15px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      backdrop-filter: blur(5px);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      font-weight: 600;
      font-size: 24px;
      color: #f0f0f0;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      background: #3a3a3a;
      color: #fff;
    }

    input::placeholder, textarea::placeholder {
      color: #bbb;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #00b894;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #019f7a;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }

    @media (max-width: 480px) {
      .container { padding: 25px 15px; }
      h2 { font-size: 20px; }
      input, textarea { font-size: 14px; padding: 12px; }
      button { font-size: 15px; padding: 12px; }
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Send WhatsApp Message</h2>

    <form id="messageForm">
      <input type="text" id="phone" placeholder="Enter WhatsApp Number" required />
      <textarea id="msg" rows="4" placeholder="Write your message..." required></textarea>
      <button type="submit">Tuma</button>
    </form>

    <div id="status"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
