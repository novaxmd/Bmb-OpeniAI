<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>WhatsApp Message Sender</title>
</head>
<body>

  <h2>Tuma Ujumbe WhatsApp</h2>

  <form id="messageForm">
    <label>Namba ya WhatsApp:</label><br />
    <input type="text" id="phone" placeholder="+2557xxxxxxxx" required /><br /><br />

    <label>Ujumbe wako:</label><br />
    <textarea id="message" placeholder="Andika ujumbe hapa..." required></textarea><br /><br />

    <button type="submit">Tuma</button>
  </form>

  <script type="module" src="app.js"></script>
</body>
</html>
