<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send Message</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0044cc, #0099ff);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      background: rgba(255, 255, 255, 0.15);
      padding: 30px;
      width: 90%;
      max-width: 400px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      margin-bottom: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #ffffff;
      color: #0044cc;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      background: #e6e6e6;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      font-size: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Send Message</h2>

    <form id="messageForm">
      <input type="text" id="phone" placeholder="Ingiza Namba ya WhatsApp" required />

      <textarea id="msg" rows="4" placeholder="Andika Ujumbe Wako..." required></textarea>

      <button type="submit">Tuma</button>
    </form>

    <div id="status"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
  </html>
