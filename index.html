<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DENIC ASISTANT</title>
    <style>
        /* UI Everything remains exactly as you had it */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 60px;
            background: #000;
            display: flex;
            align-items: center;
            padding-left: 20px;
            font-size: 22px;
            border-bottom: 1px solid #222;
        }

        .chat-box {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }

        .input-area {
            display: flex;
            padding: 10px;
            background: #000;
            border-top: 1px solid #222;
        }

        .input-area input {
            flex: 1;
            padding: 10px;
            border: none;
            outline: none;
            background: #222;
            color: white;
            border-radius: 5px;
        }

        .input-area button {
            padding: 10px 20px;
            margin-left: 10px;
            background: #0a84ff;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .user-message {
            background: #0f62fe;
            padding: 10px;
            margin: 10px 0;
            width: fit-content;
            border-radius: 10px;
            max-width: 70%;
        }

        .bot-message {
            background: #333;
            padding: 10px;
            margin: 10px 0;
            width: fit-content;
            border-radius: 10px;
            max-width: 70%;
        }
    </style>
</head>

<body>

    <div class="header">DENIC ASSISTANT</div>

    <div id="chatBox" class="chat-box"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Andika ujumbe...">
        <button id="sendBtn">Tuma</button>
    </div>

<script>
const chatBox = document.getElementById("chatBox");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

/* Add Messages */
function addMessage(sender, message) {
    const div = document.createElement("div");
    div.className = sender === "user" ? "user-message" : "bot-message";
    div.textContent = message;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

/* --- NEW: CONNECT TO OUR BACKEND SERVER (Node.js) --- */
async function sendToServer(message) {
    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: message })
        });

        const data = await response.json();
        return data.reply;  // reply from server.js
    } catch (error) {
        return "⚠ Hitilafu imejitokeza kwenye server.";
    }
}

/* Send Button */
sendBtn.addEventListener("click", async () => {
    const text = userInput.value.trim();
    if (!text) return;

    addMessage("user", text);
    userInput.value = "";

    addMessage("bot", "⏳ Inafikiri…");

    const botReply = await sendToServer(text);

    // Replace typing message with actual response
    chatBox.lastChild.textContent = botReply;
});

/* Send with Enter Key */
userInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendBtn.click();
});
</script>

</body>
</html>
